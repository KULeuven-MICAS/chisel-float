
# Run Scala Unit Test
name: Run Scala Unit Test
on:
  push:

    branches: ["main"]
  pull_request:

jobs:
  run:
    name: Build and Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' &&
            github.ref_name == 'main' }}
          activate-environment: true
      - name: Run the unit tests
        # Generates the MPFR golden vectors first; fail instead of skipping FpGoldenVectorTest if they are missing
        env:
          FP_GOLDEN_REQUIRED: 1
        run: |
          pixi run test
